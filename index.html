<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>be동사 탐험대!</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --am-color: #FF6B6B;
            --are-color: #4ECDC4;
            --is-color: #FFE66D;
            --background-color: #F7F9FC;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2.2rem;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: #E0E6ED;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.05);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* 학습 모드 스타일 */
        .concept-cards {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            flex: 1;
            min-width: 200px;
            padding: 20px;
            border-radius: 15px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .card.am { background-color: var(--am-color); }
        .card.are { background-color: var(--are-color); color: #333; }
        .card.is { background-color: var(--is-color); color: #333; }

        .card h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .card ul {
            list-style: none;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        /* 퀴즈 모드 스타일 */
        .quiz-container {
            background-color: #F0F4F8;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .question-box {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 3px solid var(--primary-color);
            margin: 0 10px;
            color: var(--primary-color);
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .option-btn {
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border: 2px solid #DDD;
            border-radius: 12px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: #EBF3FA;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 40px;
            padding: 10px;
            border-radius: 8px;
        }

        .feedback.correct {
            color: #27AE60;
            background-color: #E8F8F5;
        }

        .feedback.wrong {
            color: #C0392B;
            background-color: #FDEDEC;
        }

        .explanation {
            display: block;
            margin-top: 6px;
            font-size: 1.05rem;
            font-weight: normal;
            color: #444;
        }

        .next-btn {
            margin-top: 20px;
            padding: 12px 28px;
            font-size: 1.1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-weight: bold;
        }

        .next-btn:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎈 be동사 탐험대 🎈</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('learn')">개념 배우기</button>
        <button class="tab-btn" onclick="switchTab('quiz')">퀴즈 풀기</button>
    </div>

    <!-- 개념 배우기 섹션 -->
    <div id="learn" class="content-section active">
        <p style="font-size: 1.2rem; margin-bottom: 20px;">주어(주인공)에 따라 be동사의 모습이 달라져요!</p>
        <div class="concept-cards">
            <div class="card am">
                <h2>am</h2>
                <ul>
                    <li><strong>I</strong> am</li>
                    <li>(나)</li>
                </ul>
            </div>
            <div class="card are">
                <h2>are</h2>
                <ul>
                    <li><strong>You</strong> are</li>
                    <li><strong>We</strong> are</li>
                    <li><strong>They</strong> are</li>
                    <li>(여러 명/너)</li>
                </ul>
            </div>
            <div class="card is">
                <h2>is</h2>
                <ul>
                    <li><strong>He</strong> is</li>
                    <li><strong>She</strong> is</li>
                    <li><strong>It</strong> is</li>
                    <li>(한 명/한 개)</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 퀴즈 풀기 섹션 -->
    <div id="quiz" class="content-section">
        <div class="quiz-container">
            <div class="score-board">점수: <span id="score">0</span>점</div>
            <div class="question-box" id="question">
                I <span class="blank">?</span> a student.
            </div>
            <div class="options">
                <button class="option-btn" onclick="checkAnswer('am')">am</button>
                <button class="option-btn" onclick="checkAnswer('are')">are</button>
                <button class="option-btn" onclick="checkAnswer('is')">is</button>
            </div>
            <div id="feedback" class="feedback"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">다음 문제</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        { sentence: "I ___ a student.", answer: "am", translation: "나는 학생입니다.", reason: "주어가 'I(나)'일 때는 am을 사용해요!" },
        { sentence: "You ___ very kind.", answer: "are", translation: "너는 매우 친절하다.", reason: "주어가 'You(너)'일 때는 are를 사용해요!" },
        { sentence: "She ___ my friend.", answer: "is", translation: "그녀는 나의 친구이다.", reason: "주어가 'She(그녀 - 한 명)'일 때는 is를 사용해요!" },
        { sentence: "They ___ playing soccer.", answer: "are", translation: "그들은 축구를 하고 있다.", reason: "주어가 'They(그들 - 여러 명)'일 때는 are를 사용해요!" },
        { sentence: "It ___ a cat.", answer: "is", translation: "그것은 고양이이다.", reason: "주어가 'It(그것 - 하나)'일 때는 is를 사용해요!" },
        { sentence: "We ___ happy today.", answer: "are", translation: "우리는 오늘 행복하다.", reason: "주어가 'We(우리 - 여러 명)'일 때는 are를 사용해요!" },
        { sentence: "He ___ a smart teacher.", answer: "is", translation: "그는 스마트한 선생님이다.", reason: "주어가 'He(그 - 한 명)'일 때는 is를 사용해요!" },
        { sentence: "I ___ 10 years old.", answer: "am", translation: "나는 10살입니다.", reason: "주어가 'I(나)'일 때는 언제나 am을 사용해요!" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'learn') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('learn').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('quiz').classList.add('active');
            resetQuiz();
        }
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];
        const formattedSentence = q.sentence.replace('___', '<span class="blank">?</span>');
        document.getElementById('question').innerHTML = formattedSentence + `<br><span style="font-size: 1rem; color: #666; font-weight: normal;">(${q.translation})</span>`;
        
        const feedbackEl = document.getElementById('feedback');
        feedbackEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = false);
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedOption) {
        if (answered) return;
        answered = true;

        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

        const q = questions[currentQuestionIndex];
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');

        if (selectedOption === q.answer) {
            score += 10;
            document.getElementById('score').textContent = score;
            feedbackEl.innerHTML = `정답입니다! 🎉 <span class="explanation">💡 <strong>해설:</strong> ${q.reason}</span>`;
            feedbackEl.className = "feedback correct";
            const formattedSentence = q.sentence.replace('___', `<span class="blank" style="border-bottom: none; font-weight: bold;">${q.answer}</span>`);
            document.getElementById('question').innerHTML = formattedSentence + `<br><span style="font-size: 1rem; color: #666; font-weight: normal;">(${q.translation})</span>`;
        } else {
            feedbackEl.innerHTML = `아쉬워요! 정답은 '<strong>${q.answer}</strong>' 입니다. <span class="explanation">💡 <strong>해설:</strong> ${q.reason}</span>`;
            feedbackEl.className = "feedback wrong";
        }

        nextBtn.style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
        loadQuestion();
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('score').textContent = score;
        loadQuestion();
    }

    // 초기 실행
    loadQuestion();
</script>

</body>
</html>
